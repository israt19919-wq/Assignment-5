<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--title and logo-->
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!--font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--tailwind and daisy-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--style.css-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--login form-->
    <section class="flex justify-center pt-12 ">
        <fieldset class="bg-[#FFFFFF] fieldset bg-base-200 border-base-300 rounded-box w-xs border p-10 shadow-md">

            <div class="flex justify-center">
                <section class="w-100 text-center">
                    <img src="assets/github-logo.png" class="w-18 mx-auto">

                    <h2 class="font-bold text-xl">GitHub Issues Tracker</h2>
                    <p class="text-gray-600 font-bold">Sign in to manage your issues</p>
                </section>
            </div>


            <label class="font-bold">Username</label>
            <input id="user-name" type="name" class="input w-full"  placeholder="Enter Username" />
            <a class="text-[#4A00FF]" href="">Default:admin</a>

            <label class="font-bold">Password</label>
            <input id="user-pass" type="password" class="input w-full"  placeholder="Enter Password" />
            <a class="text-[#4A00FF]" href="">Default:admin123</a>

            <button id="sign-btn" class="btn btn-primary mt-4">Sign In</button>

            <div class="flex items-center gap-2 pt-4">
                <div class="flex-1 border-t border-gray-200"></div>
                <span class="text-sm text-gray-600">OR</span>
                <div class="flex-1 border-t border-gray-200"></div>
            </div>

            <p class="text-center text-gray-600 py-8">Demo Credentials:</p>
            <div class="text-center py-5 bg-[#F8FAFC]">
                <p><span class="font-semibold">Username: </span>admin</p>
                <p><span class="font-semibold">Password: </span>admin123</p>
            </div>
        </fieldset>
        
      
    </section>


    <script src="login.js"></script>
    <script src="script.js"></script>
</body>

</html>
