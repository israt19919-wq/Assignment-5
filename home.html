<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--title and logo-->
    <title>GitHub Issues Home page</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!--font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--tailwind and daisy-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--style.css-->
    <link rel="stylesheet" href="style.css">
</head>

<body class="px-5 py-5">

    <!--navbar-->
    <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl">All Issues</a>
        </div>
        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="Search" class="input w-24 md:w-auto" />
            <button id="search-button" type="button" class="btn bg-primary text-primary-content">Button</button>
        </div>
    </div>

   
    <section class=" pt-6 ">
        <div class="all-button flex gap-3 ">
            <button id="all-button" class="btn sm:px-10  sm:w-auto bg-gray-200 ">
                All
            </button>
            <button id="open-button" class="btn sm:px-10  sm:w-auto bg-gray-200">
                Open
            </button>
            <button id="close-button" class="btn sm:px-10  sm:w-auto bg-gray-200">
                Closed
            </button>
        </div>
    </section>

    <br>
    <!-- //heading// -->
    <section class="flex justify-between items-center bg-base-200 shadow-sm px-4 py-4">
        <div class="flex">
            <div class="flex justify-center items-center bg-[#ECE4FF] rounded-full w-12 h-12">
                <img src="assets/Aperture.png" alt="">
            </div>
            <div class="px-2">
                <h2 id="issue-count" class="font-bold text-lg">0 Issues</h2>
                <div id="issue-cntainer"></div>
                <p class="text-[#64748B]">
                    Track and manage your project issues
                </p>
            </div>
        </div>
    
        <div class="flex gap-5">
            <span class="flex justify-center items-center gap-2">
                <i class="fa-solid fa-circle" style="color:#00A96E;"></i>
                <p class="font-semibold ">Open</p>
            </span>
            <span class="flex justify-center items-center gap-2">
                <i class="fa-solid fa-circle" style="color:#A855F7;"></i>
                <p class="font-semibold">Closed</p>
            </span>
        </div>
    </section>

    

    <!-- //All issues section//-->
    <section id="all-issues" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 py-5">
        <div>

        </div>
    </section> 

    <dialog id="issues-modal" class="modal"></dialog>
       
    


   
    <script src="script.js"></script>


</body>

</html>
